# Auto-merge de PRs do Dependabot (2026-07-29).
#
# Motivo: PRs de dependência acumulavam por semanas (lote de 15/06 ficou
# 40+ dias aberto) porque patch/minor de baixo risco não têm um "momento
# óbvio de clique". Este workflow marca o PR para auto-merge e o GitHub
# só mergeia quando TODOS os checks obrigatórios da branch protection
# (ci + Vercel, com strict=true) passarem — nada entra sem CI verde.
#
# Política (conservadora de propósito):
#   - semver-PATCH (prod e dev)            → auto-merge
#   - semver-MINOR de devDependencies      → auto-merge
#   - minor de produção, major, qualquer pin sensível → fica MANUAL
#
# Pré-requisito: "Allow auto-merge" ligado nas settings do repo
# (Settings → General → Pull Requests). Sem ele o `gh pr merge --auto`
# falha e o PR simplesmente fica aguardando revisão manual — fail-safe.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Metadados do update
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Habilita auto-merge (patch / dev-minor)
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          (steps.meta.outputs.update-type == 'version-update:semver-minor' &&
           steps.meta.outputs.dependency-type == 'direct:development')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
